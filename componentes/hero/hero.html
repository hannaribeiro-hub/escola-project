<section id="inicio" class="relative w-full h-screen min-h-[560px] overflow-hidden bg-slate-900">
      <div id="heroSlides"></div>
      <div class="absolute bottom-6 left-0 right-0 z-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between">
          <div id="heroDots" class="flex items-center gap-2"></div>
          <div class="flex items-center gap-2">
            <button onclick="prevSlide()" class="w-10 h-10 rounded-full bg-black/40 hover:bg-white text-white hover:text-slate-900 border border-white/20 flex items-center justify-center transition-all" aria-label="Anterior">
              <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </button>
            <button onclick="nextSlide()" class="w-10 h-10 rounded-full bg-black/40 hover:bg-white text-white hover:text-slate-900 border border-white/20 flex items-center justify-center transition-all" aria-label="Próximo">
              <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
          </div>
        </div>
      </div>
    </section>
