<section id="eventos" class="py-20 bg-white border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="mb-8">
          <span class="text-secondary font-headline text-label-sm font-bold uppercase tracking-wider">Vida Escolar</span>
          <h2 class="font-headline font-bold text-headline-md text-primary mt-1">Eventos Recentes</h2>
        </div>
        <div id="eventosViewer" class="reveal relative rounded-2xl overflow-hidden bg-slate-900 shadow-xl">
          <div id="evTrack" class="flex w-full transition-transform duration-500 ease-out"></div>
          <button id="evPrev" class="absolute left-3 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 text-white flex items-center justify-center transition" aria-label="Anterior">
            <span class="material-symbols-outlined text-[22px]">chevron_left</span>
          </button>
          <button id="evNext" class="absolute right-3 top-1/2 -translate-y-1/2 z-10 w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 text-white flex items-center justify-center transition" aria-label="Próximo">
            <span class="material-symbols-outlined text-[22px]">chevron_right</span>
          </button>
          <div class="absolute bottom-0 left-0 right-0 z-10 bg-gradient-to-t from-black/85 via-black/40 to-transparent px-6 pt-16 pb-6">
            <h3 id="evTitulo" class="font-headline font-bold text-white text-headline-sm"></h3>
            <p id="evDesc" class="text-white/80 text-body-sm mt-1 max-w-2xl"></p>
          </div>
          <div id="evDots" class="absolute top-4 right-4 z-10 flex items-center gap-1.5"></div>
        </div>
      </div>
    </section>
