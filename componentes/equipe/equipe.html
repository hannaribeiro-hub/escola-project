<section id="equipe" class="py-20 bg-white">
      <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex items-center justify-between mb-10">
          <div>
            <span class="text-secondary font-headline text-label-sm font-bold uppercase tracking-wider">Corpo Docente</span>
            <h2 class="font-headline font-bold text-headline-md text-primary mt-1">Gestores e Professores</h2>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="scrollTeam(-300)" class="w-10 h-10 rounded-full border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700" aria-label="Anterior">
              <span class="material-symbols-outlined text-[20px]">chevron_left</span>
            </button>
            <button onclick="scrollTeam(300)" class="w-10 h-10 rounded-full border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-700" aria-label="Próximo">
              <span class="material-symbols-outlined text-[20px]">chevron_right</span>
            </button>
          </div>
        </div>
        <div id="teamContainer" class="flex gap-6 overflow-x-auto scroll-smooth py-2 no-scrollbar"></div>
        <div class="mt-8 text-center">
          <button id="btnVerTodos" class="inline-flex items-center gap-2 px-6 py-3 rounded-full border border-primary text-primary font-headline text-label-md font-semibold hover:bg-primary hover:text-white transition-all">
            <span>Ver todos os membros</span>
            <span class="material-symbols-outlined text-[18px]">groups</span>
          </button>
        </div>
      </div>

      <div id="modalEquipe" class="hidden fixed inset-0 z-[70]">
        <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm" data-close-modal></div>
        <div class="relative mx-auto mt-[5vh] w-[calc(100%-2rem)] max-w-5xl bg-white rounded-2xl shadow-2xl max-h-[85vh] flex flex-col overflow-hidden">
          <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
            <div>
              <h3 class="font-headline font-bold text-headline-sm text-primary">Equipe Completa</h3>
              <p class="text-body-sm text-slate-500" id="modalContador"></p>
            </div>
            <button data-close-modal class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-600" aria-label="Fechar">
              <span class="material-symbols-outlined text-[22px]">close</span>
            </button>
          </div>
          <div id="modalList" class="overflow-y-auto p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
      </div>
    </section>
